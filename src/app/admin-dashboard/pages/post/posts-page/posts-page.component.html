<div class="mb-5">
  <h1 class="text-2xl text-secondary">Lista de Post</h1>
</div>
<div class="divider divider-secondary"></div>

<div class="flex w-full items-center justify-between gap-4 h-20">
  <label class="floating-label">
    <span>Items por página</span>
    <select
      class="select select-bordered w-32"
      (change)="setLimit(itemPP.value)"
      #itemPP
    >
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
    </select>
  </label>
  <div class="flex-1 flex justify-center">
    <app-pagination
      [pages]="PostResource.value()?.data?.totalPages ?? 0"
      [currentPage]="paginationService.currentPage()"
    >
    </app-pagination>
  </div>
  <button class="btn btn-secondary" routerLink="/dashboard/posts/new">
    <i class="bi bi-plus-circle"></i>New Post
  </button>
</div>

@if (PostResource.isLoading()) {
  <div class="flex justify-center items-center h-screen">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}

@if (PostResource.hasValue()) {
  <post-table
    [posts]="PostResource.value().data.posts"
    [offset]="(paginationService.currentPage() - 1) * limit()"
    (delete)="deletedPost($event)"
  ></post-table>
} @else {
  <div class="flex justify-center items-center h-screen">
    <h2 class="text-2xl">No hay publicaciones para mostrar</h2>
  </div>
}
