<div class="overflow-x-auto rounded-box border border-base-content/30">
  <table class="table text-center w-full">
    <!-- head -->
    <thead>
      <tr>
        <th>#</th>
        <th>Author</th>
        <th>Title</th>
        <th>Publish Date</th>
        <th>Options</th>
      </tr>
    </thead>
    <tbody>
      @for (post of posts(); track post.id; let i = $index) {
        <tr>
          <th>{{ i + 1 + offset() }}</th>
          <td>
            <div class="flex items-center gap-3 justify-center">
              <div class="avatar">
                <div class="mask mask-squircle h-12 w-12">
                  <img
                    src="http://localhost:3000/api/users/avatar/{{
                      post.Author.id
                    }}"
                    alt="Avatar"
                  />
                </div>
              </div>
              <div>
                <div class="font-bold">
                  {{ post.Author.first_name }} {{ post.Author.last_name }}
                </div>
                <div class="text-sm opacity-50">{{ post.Author.email }}</div>
              </div>
            </div>
          </td>
          <td>
            <h2 class="text-lg font-semibold">{{ post.title }}</h2>
          </td>
          <td>
            <span class="badge badge-ghost badge-sm">{{ post.createdAt }}</span>
          </td>
          <td>
            <button
              class="btn btn-error btn-xs rounded-full py-4 me-3"
              (click)="emitDeleted(post.id)"
            >
              <i class="bi bi-trash text-lg"></i>
            </button>

            <button
              class="btn btn-info btn-xs rounded-full py-4 me-3"
              [routerLink]="['/dashboard/posts/', post.id]"
            >
              <i class="bi bi-pencil-square"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
