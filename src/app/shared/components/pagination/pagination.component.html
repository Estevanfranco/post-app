<div class="flex items-center w-full mt-4 mb-10">
    <div class="join flex justify-center items-center w-full">
        @for(page of getPageList(); track page){
            <button class="join-item btn" [class.btn-secondary]="page === activaPage()"
            [routerLink]="[]"
            [queryParams]="{page:page}"
            (click)="activaPage.set(page)"
            >
            {{ page }}
        </button>

        } @empty {
            <p>No hay paginas</p>
        }
    </div>
</div>
